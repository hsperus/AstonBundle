{% if messages %}<div class="toast-wrap" aria-live="polite">{% for m in messages %}<div class="toast{% if m.level_tag == 'error' %} err{% endif %}" role="status" data-toast><span class="i {% if m.level_tag == 'error' %}i-alert{% else %}i-okc{% endif %}" aria-hidden="true"></span><span style="flex:1">{{ m }}</span>{% if 'basket' in m.extra_tags %}<a href="{% url 'orders:basket' %}">View basket</a>{% endif %}<button type="button" class="ibtn" aria-label="Dismiss" data-close-toast><span class="i i-x s16" aria-hidden="true"></span></button></div>{% endfor %}</div>{% endif %}
