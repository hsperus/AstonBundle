name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ab
          POSTGRES_PASSWORD: ab
          POSTGRES_DB: ab
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://ab:ab@localhost:5432/ab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy --fail-level ERROR || true
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
      - name: Production static build (same as the Docker image)
        run: DJANGO_DEBUG=false python manage.py collectstatic --noinput
